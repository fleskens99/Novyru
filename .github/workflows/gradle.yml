
name: Java CI with Gradle

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # 1. Get the repository code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Install Java 25
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      # 3. Configure Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Build project and run tests
      - name: Build with Gradle
        env:
          RECIPE_API_KEY: ${{ secrets.RECIPE_API_KEY }}
        run: bash ./gradlew clean build --stacktrace
